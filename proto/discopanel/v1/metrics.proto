syntax = "proto3";

package discopanel.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nickheyer/discopanel/pkg/proto/discopanel/v1;discopanelv1";

// Metric history and alerting service
service MetricService {
  // List recorded metric samples for a server
  rpc ListMetricHistory(ListMetricHistoryRequest) returns (ListMetricHistoryResponse);
  // List all alert rules
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse);
  // Get a specific alert rule
  rpc GetAlertRule(GetAlertRuleRequest) returns (GetAlertRuleResponse);
  // Create a new alert rule
  rpc CreateAlertRule(CreateAlertRuleRequest) returns (CreateAlertRuleResponse);
  // Update an existing alert rule
  rpc UpdateAlertRule(UpdateAlertRuleRequest) returns (UpdateAlertRuleResponse);
  // Delete an alert rule
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse);
  // Evaluate a rule against current metrics without persisting state (for UI preview)
  rpc TestAlertRule(TestAlertRuleRequest) returns (TestAlertRuleResponse);
  // List recent alert firing/resolution events
  rpc ListAlertEvents(ListAlertEventsRequest) returns (ListAlertEventsResponse);
}

// Metric an alert rule can watch
enum AlertMetric {
  ALERT_METRIC_UNSPECIFIED = 0;
  ALERT_METRIC_CPU_PERCENT = 1;    // Container CPU usage percent
  ALERT_METRIC_MEMORY_PERCENT = 2; // Container memory usage as percent of allocation
  ALERT_METRIC_TPS = 3;            // Server ticks per second (20 = optimal)
  ALERT_METRIC_PLAYERS_ONLINE = 4; // Player count
  ALERT_METRIC_DISK_PERCENT = 5;   // Server data disk usage percent of total
}

// Comparison direction for an alert rule
enum AlertComparator {
  ALERT_COMPARATOR_UNSPECIFIED = 0;
  ALERT_COMPARATOR_BELOW = 1; // Fires when metric < threshold
  ALERT_COMPARATOR_ABOVE = 2; // Fires when metric > threshold
}

// Alert rule definition
message AlertRule {
  string id = 1;
  string name = 2;
  string description = 3;
  string server_id = 4; // Empty = applies to all servers
  AlertMetric metric = 5;
  AlertComparator comparator = 6;
  double threshold = 7;
  int32 duration_secs = 8;  // Condition must hold continuously for this long before firing (0 = immediate)
  int32 cooldown_secs = 9;  // Minimum time between repeat firings (0 = default 300s)
  bool enabled = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// Current lifecycle of an alert firing
enum AlertState {
  ALERT_STATE_UNSPECIFIED = 0;
  ALERT_STATE_FIRING = 1;
  ALERT_STATE_RESOLVED = 2;
}

// Record of an alert firing or resolving
message AlertEvent {
  string id = 1;
  string rule_id = 2;
  string rule_name = 3;
  string server_id = 4;
  AlertState state = 5;
  double value = 6;      // Observed metric value at fire/resolve time
  double threshold = 7;
  string message = 8;    // Human-readable summary
  google.protobuf.Timestamp created_at = 9;
}

// A recorded metric sample
message MetricSample {
  string server_id = 1;
  google.protobuf.Timestamp timestamp = 2;
  double cpu_percent = 3;
  double memory_usage = 4;  // MB
  double memory_total = 5;  // MB allocated to the server
  double tps = 6;
  int32 players_online = 7;
  int64 disk_usage = 8;     // Bytes
  int64 disk_total = 9;     // Bytes
}

// List metric history request
message ListMetricHistoryRequest {
  string server_id = 1;
  int32 range_secs = 2;   // How far back to look (0 = default 1 hour)
  int32 max_points = 3;   // Downsample to at most this many points (0 = no downsampling)
}

// Metric history response
message ListMetricHistoryResponse {
  repeated MetricSample samples = 1;
}

// List alert rules request (server_id optional filter: rules for a server = rules targeting it + global rules)
message ListAlertRulesRequest {
  string server_id = 1;
}

// List of alert rules
message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
}

// Get alert rule request
message GetAlertRuleRequest {
  string id = 1;
}

// Single alert rule
message GetAlertRuleResponse {
  AlertRule rule = 1;
}

// Create alert rule request
message CreateAlertRuleRequest {
  string name = 1;
  string description = 2;
  string server_id = 3;
  AlertMetric metric = 4;
  AlertComparator comparator = 5;
  double threshold = 6;
  int32 duration_secs = 7;
  int32 cooldown_secs = 8;
  bool enabled = 9;
}

// Created alert rule
message CreateAlertRuleResponse {
  AlertRule rule = 1;
}

// Update alert rule request
message UpdateAlertRuleRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string server_id = 4;
  optional AlertMetric metric = 5;
  optional AlertComparator comparator = 6;
  optional double threshold = 7;
  optional int32 duration_secs = 8;
  optional int32 cooldown_secs = 9;
  optional bool enabled = 10;
}

// Updated alert rule
message UpdateAlertRuleResponse {
  AlertRule rule = 1;
}

// Delete alert rule request
message DeleteAlertRuleRequest {
  string id = 1;
}

// Empty response for successful deletion
message DeleteAlertRuleResponse {}

// Test alert rule request (rule fields evaluated against current metrics, not persisted)
message TestAlertRuleRequest {
  string server_id = 1;
  AlertMetric metric = 2;
  AlertComparator comparator = 3;
  double threshold = 4;
}

// Test alert rule response
message TestAlertRuleResponse {
  bool would_fire = 1;
  double current_value = 2;
}

// List alert events request
message ListAlertEventsRequest {
  string server_id = 1; // Optional filter
  int32 limit = 2;      // 0 = default 50
}

// List of alert events
message ListAlertEventsResponse {
  repeated AlertEvent events = 1;
}
